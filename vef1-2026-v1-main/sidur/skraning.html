    <header>
      <h1>Skráning í ferð</h1>

      <p><a href="#efni">Beint í efni</a>.</p>

      <nav>
        <ul>
          <li><a href="../index.html">Forsíða</a></li>
          <li><a href="um.html">Um</a></li>
          <li><a href="ferdir.html">Skoða ferðir</a></li>
          <li><a href="skraning.html">Skráning</a></li>
        </ul>
      </nav>
    </header>

    <main id="efni">
      <form>
        <div>
          <label for="ferd">Veldu ferð:</label>
          <select id="ferd">
            <option>jöklaklifur</option>
            <option>Gullnihringurinn</option>
            <option>Silfurkassinn</option>
            <option>Bronsþríhyrningurinn</option>
            <option>Köfunarferð</option>
            <option>Norðurljósaferð</option>
            <option>Reykjavíkurrölt</option>
          </select>
        </div>

        <div>
          <label>Fjöldi þátttakenda: <input type="number" min="1" value="1"></label>
        </div>
 
        <div>
          <label>Hvaða tíma?
            <select>
              <option value="">Veldu tíma</option>
              <option>Fyrir hádegi</option>
              <option>Eftir hádegi</option>
              <option>Kvöld</option>
            </select>
          </label>
        </div>
  
        <div>
          <label>Netfang: <input type="email"></label>
        </div>
  
        <div>
          <label>Símanúmer: <input type="tel"></label>
        </div>
  
        <div>
          <label>Dagsetning: <input type="date"></label>
        </div>

        <div>
          <label>Hver er reynsla hópsins?</label>
          <textarea rows="4" cols="40"></textarea>
        </div>

        <div>
          <label>
            <input type="checkbox"> Ég samþykki <a href="um.html" target="_blank">skilmálana</a>
          </label>
        </div>

        <div>
          <button type="submit">Samþykja skráningu</button>
        </div>
      </form>

      <p><a href="../index.html">Aftur á forsíðu</a>.</p>
    </main>
